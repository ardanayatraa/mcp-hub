worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Docker's resolver, asked again every 10 s. The backend is looked up by name on each request,
    # so a recreated backend (new IP) never leaves this proxy talking to an address that is gone.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Caddy (the host's TLS front) reaches this container as the network gateway; only from there is
    # its X-Forwarded-For believed, so the client address the backend rate-limits on cannot be spoofed.
    set_real_ip_from 172.31.250.1;
    real_ip_header X-Forwarded-For;

    server {
        listen 80;
        root /usr/share/nginx/html;
        access_log off;

        set $backend http://backend:8000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        # The backend sends its own security headers; keep one copy of each (the front proxy's).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;

        location /api/ { proxy_pass $backend; }

        location /mcp {
            proxy_pass $backend;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # Streamed chat answers and the model gateway.
        location ~ ^/(chat|gateway)/ {
            proxy_pass $backend;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location = /health { proxy_pass $backend; }
        location = /ready { proxy_pass $backend; }

        # Built files carry a content hash in their names, so they can be cached for good.
        location /assets/ {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            expires max;
            try_files $uri =404;
        }

        # index.html and every app route that falls back to it is checked on each load.
        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }

}
