site_name: MCP Hub Docs
site_description: MCP Hub and Laravel MCP Hub 1.0 documentation — installation, integration, APIs, security, and operations.
site_url: https://ardanayatraa.github.io/mcp-hub/
repo_url: https://github.com/ardanayatraa/mcp-hub
repo_name: ardanayatraa/mcp-hub
edit_uri: edit/main/documentation/
docs_dir: documentation
site_dir: site
strict: true
theme:
  name: material
  language: en
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/styles.css
extra:
  generator: false
copyright: MCP Hub · Project documentation
nav:
  - Get started:
      - Overview: index.md
      - Concepts and architecture: start/concepts.md
      - Implementation paths: start/quickstart.md
      - Release status and versions: start/releases.md
  - MCP Hub:
      - Run locally: hub/local.md
      - Connect an application: hub/connect.md
      - Clients, tools, and profiles: hub/clients.md
      - Chat and model gateway: hub/chat.md
      - Production and recovery: hub/operations.md
  - Laravel 1.0:
      - Installation: laravel/install.md
      - Pairing and configuration: laravel/connection.md
      - Resources and permissions: laravel/resources.md
      - CRUD proposals: laravel/commands.md
      - Chat and SDK: laravel/chat.md
      - Private exports: laravel/exports.md
      - Upgrades and maintenance: laravel/upgrade.md
  - Reference:
      - Endpoint map: reference/endpoints.md
      - Admin and MCP API: reference/admin-api.md
      - Connector contract: reference/connector-contract.md
      - Tools and reporting: reference/tools.md
      - Access profiles: reference/profiles.md
      - Artisan and configuration: reference/laravel.md
  - Operations and support:
      - Security: help/security.md
      - Troubleshooting: help/troubleshooting.md
      - Contribute to the documentation: help/contributing.md
