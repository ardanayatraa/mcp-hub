name: Documentation

on:
  push:
    branches: [main]
    paths: ['documentation/**', 'docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/build_docs_reference.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['documentation/**', 'docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/build_docs_reference.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/build_docs_reference.py
      - run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
