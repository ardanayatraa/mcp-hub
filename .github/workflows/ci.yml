name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  hub:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub -d hub_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: hub
    env:
      ENVIRONMENT: test
      SECRET_ENCRYPTION_KEY: WyzcJBTgZUDuBhqKXe8GWpoJSvp2nR5J9ag3X5fMf5g=
      SESSION_SIGNING_KEY: ci-only-session-signing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: Contract, security, reporting, MCP and migration tests
        run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Fresh PostgreSQL schema, repeat migration and first admin
        env:
          DATABASE_URL: postgresql+psycopg://hub:ci-only-password@localhost:5432/hub_test
          ADMIN_INITIAL_PASSWORD: ChangeMe-Now-12
        run: |
          npm run migrate
          npm run migrate
          npm run bootstrap
      - name: Dependency vulnerability audit (shipped packages)
        run: npm audit --omit=dev --audit-level high

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  docker-smoke:
    needs: [hub, sdk]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      SECRET_ENCRYPTION_KEY: WyzcJBTgZUDuBhqKXe8GWpoJSvp2nR5J9ag3X5fMf5g=
      SESSION_SIGNING_KEY: ci-only-session-signing-key
      ADMIN_INITIAL_PASSWORD: ChangeMe-Now-12
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the disposable stack
        run: docker compose -f infra/compose.yml up --build --wait --wait-timeout 180
      - name: Verify HTTPS edge and service readiness
        run: |
          curl --fail --silent --insecure https://localhost:8443/ready
          curl --fail --silent --insecure https://localhost:8443/ | grep 'MCP Hub'
      - name: Restart the hub with its PostgreSQL configuration preserved
        run: |
          docker compose -f infra/compose.yml restart hub
          for attempt in $(seq 1 30); do
            if curl --fail --silent --insecure https://localhost:8443/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Logs and teardown
        if: always()
        run: |
          docker compose -f infra/compose.yml logs
          docker compose -f infra/compose.yml down --volumes
