name: Deploy aaPanel

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AAPANEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: aapanel-production
    timeout-minutes: 30
    concurrency:
      group: aapanel-production-${{ github.repository_id }}
      cancel-in-progress: false
    steps:
      - name: Ignore a superseded main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" == "$EXPECTED_COMMIT" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this deployment is skipped.'
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.latest.outputs.current == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.latest.outputs.current == 'true'
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.latest.outputs.current == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend from the tested commit
        if: steps.latest.outputs.current == 'true'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build release and deploy over pinned SSH
        if: steps.latest.outputs.current == 'true'
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          AAPANEL_SSH_HOST: ${{ secrets.AAPANEL_SSH_HOST }}
          AAPANEL_SSH_USER: ${{ secrets.AAPANEL_SSH_USER }}
          AAPANEL_SSH_PORT: ${{ vars.AAPANEL_SSH_PORT || '22' }}
          AAPANEL_SSH_PRIVATE_KEY: ${{ secrets.AAPANEL_SSH_PRIVATE_KEY }}
          AAPANEL_SSH_KNOWN_HOSTS: ${{ secrets.AAPANEL_SSH_KNOWN_HOSTS }}
        shell: bash
        run: bash deploy/aapanel/push-release.sh
      - name: Deployment result
        if: success() && steps.latest.outputs.current == 'true'
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: printf 'Deployed tested main commit %s. Server credentials stayed on the server.\n' "$DEPLOY_COMMIT" >> "$GITHUB_STEP_SUMMARY"
