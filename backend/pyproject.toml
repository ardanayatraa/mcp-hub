[project]
name = "mcp-hub"
version = "1.0.0"
description = "MCP Hub: connect business apps to AI clients and an AI chat, with reviewed, permission-checked tools"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28,<0.29",
    "httpcore>=1.0,<2",
    "itsdangerous>=2.2",
    "jsonschema>=4.23",
    "mcp>=2.1,<3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyotp>=2.9",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "anthropic>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "pip-audit>=2.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["app/persistence/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.uv]
package = false
