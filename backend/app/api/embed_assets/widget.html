<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Chat</title>
<style nonce="{{NONCE}}">{{CSS}}</style>
</head>
<body>
<div id="app" data-widget="{{WIDGET}}">
  <header class="top">
    <div class="who"><strong id="title">Chat</strong><span id="user" class="sub"></span></div>
    <div class="actions">
      <button id="signout" class="link" type="button" hidden></button>
      <button id="close" class="icon" type="button" aria-label="Close">&#x2715;</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="main">
    <p class="muted center" id="loading">…</p>
  </main>
  <form id="composer" class="composer" hidden>
    <textarea id="input" rows="1" maxlength="4000" aria-label="Message"></textarea>
    <button id="send" type="submit" aria-label="Send">&#x27A4;</button>
  </form>
</div>
<script nonce="{{NONCE}}">{{JS}}</script>
</body>
</html>
