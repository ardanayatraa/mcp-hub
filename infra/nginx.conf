worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_conn_zone $binary_remote_addr zone=per_client:10m;
    # Static files only: API answers (JSON with secrets next to user input) are never compressed.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        return 301 https://localhost:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/certs/hub.crt;
        ssl_certificate_key /etc/nginx/certs/hub.key;
        root /usr/share/nginx/html;
        limit_conn per_client 32;
        ssl_protocols TLSv1.2 TLSv1.3;
        access_log off;

        # Every location below inherits these unless it sets add_header itself.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # The backend sees the real client address (login and MFA limits are per address).
        # $remote_addr replaces whatever X-Forwarded-For the client sent, so it cannot be spoofed.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The backend sends these too; keep one copy (nginx's). Its stricter API CSP stays.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;

        location /api/ {
            proxy_pass http://backend:8000;
        }

        location /mcp {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # Apps' servers: the Hub chat (streamed answers) and the model gateway.
        location /chat/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /gateway/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location = /health {
            proxy_pass http://backend:8000/health;
        }

        location = /ready {
            proxy_pass http://backend:8000/ready;
        }

        # Built files carry a content hash in their names, so they can be cached for good.
        location /assets/ {
            expires max;
            try_files $uri =404;
        }

        # index.html (and every app route that falls back to it) is checked on each load, so a new
        # release never leaves a browser asking for files that are gone.
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
