worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_conn_zone $binary_remote_addr zone=per_client:10m;

    server {
        listen 80;
        return 301 https://localhost:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/certs/hub.crt;
        ssl_certificate_key /etc/nginx/certs/hub.key;
        root /usr/share/nginx/html;
        limit_conn per_client 32;
        ssl_protocols TLSv1.2 TLSv1.3;
        access_log off;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /mcp {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location = /health {
            proxy_pass http://backend:8000/health;
        }

        location = /ready {
            proxy_pass http://backend:8000/ready;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
