worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_conn_zone $binary_remote_addr zone=per_client:10m;

    server {
        listen 80;
        return 301 https://localhost:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/certs/hub.crt;
        ssl_certificate_key /etc/nginx/certs/hub.key;
        limit_conn per_client 32;
        ssl_protocols TLSv1.2 TLSv1.3;
        access_log off;

        # One app serves the UI, the admin API, MCP and chat. Chat answers stream.
        location / {
            proxy_pass http://hub:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 130s;
        }
    }
}
